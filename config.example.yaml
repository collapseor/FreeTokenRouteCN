server:
  port: 3000
  auth: false
  api_key: "your-local-access-token"

providers:
  deepseek:
    # 从 chat.deepseek.com 获取:
    # 1. 登录后按 F12 打开开发者工具
    # 2. Application → Local Storage → https://chat.deepseek.com
    # 3. 找到 userToken，复制 value 值填入下方
    token: "your-deepseek-web-token"
  agnesai:
    # 从 platform.agnes-ai.cn 获取:
    # 1. 注册/登录 → 设置 → API 密钥 → 创建新密钥
    # 2. 复制 sk- 开头的 API Key
    api_key: "your-agnes-api-key"
    # 可选：默认国内节点 .cn，需用国际站时改为 https://apihub.agnes-ai.com/v1
    # api_base: "https://apihub.agnes-ai.cn/v1"
  sensenova:
    # 从 platform.sensenova.cn 获取:
    # 1. 手机号注册验证 → 控制台 → API Keys → 创建
    # 2. 复制 sk- 开头的 API Key（公测期每 5 小时 1500 次免费）
    api_key: "your-sensenova-api-key"

logging:
  level: info
