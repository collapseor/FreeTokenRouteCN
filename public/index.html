<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FreeTokenRouteCN · 国内免费大模型统一入口</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="app">
    <!-- 左侧栏：会话列表 + 模型选择 -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <span class="logo-mark">F</span>
          <span class="logo-text">FreeTokenRouteCN</span>
        </div>
        <button id="new-chat" class="btn-new" title="新会话">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 5v14M5 12h14"/>
          </svg>
          <span>新会话</span>
        </button>
      </div>

      <div class="sidebar-section">
        <label class="sidebar-label">模型</label>
        <select id="model-select" class="select"></select>
      </div>

      <div class="sidebar-section">
        <label class="sidebar-label">会话历史</label>
        <div id="session-list" class="session-list">
          <div class="empty-hint">暂无会话</div>
        </div>
      </div>

      <div class="sidebar-footer">
        <div id="status-indicator" class="status-indicator loading">
          <span class="status-dot"></span>
          <span class="status-text">检查中…</span>
        </div>
      </div>
    </aside>

    <!-- 主区域：对话 -->
    <main class="main">
      <header class="main-header">
        <div class="header-info">
          <h1 id="chat-title">新会话</h1>
          <div id="chat-meta" class="chat-meta"></div>
        </div>
        <div class="header-actions">
          <button id="toggle-stream" class="btn-icon" title="流式响应" data-on="true">
            <span class="stream-label">流式 ●</span>
          </button>
          <button id="clear-msgs" class="btn-icon" title="清空当前会话消息">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/>
            </svg>
          </button>
        </div>
      </header>

      <div id="messages" class="messages">
        <div class="welcome">
          <div class="welcome-logo">F</div>
          <h2>国内免费大模型统一入口</h2>
          <p>OpenAI 兼容代理，一次接入，统一调用。支持 DeepSeek / Agnes AI / 商汤 SenseNova 等免费模型。</p>
          <div class="welcome-hints">
            <div class="hint" data-prompt="用一句话介绍你自己">
              <span class="hint-icon">💬</span>
              <span>介绍自己</span>
            </div>
            <div class="hint" data-prompt="写一段 Python 快速排序代码">
              <span class="hint-icon">⚙️</span>
              <span>写代码</span>
            </div>
            <div class="hint" data-prompt="给我讲一个关于程序员的冷笑话">
              <span class="hint-icon">😄</span>
              <span>讲笑话</span>
            </div>
          </div>
        </div>
      </div>

      <div class="composer">
        <div class="composer-inner">
          <textarea id="input" class="input" placeholder="输入消息，Enter 发送，Shift+Enter 换行…" rows="1"></textarea>
          <button id="send" class="btn-send" disabled>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
            </svg>
          </button>
        </div>
        <div class="composer-hint">
          <span id="conv-hint">未关联会话</span>
          <span class="dot">·</span>
          <span>会话上下文由服务端维护，切换模型不丢失</span>
        </div>
      </div>
    </main>
  </div>
  <script src="/app.js"></script>
</body>
</html>
